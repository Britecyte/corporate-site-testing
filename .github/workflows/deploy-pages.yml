name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public site files
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '_archive/' \
            --exclude '_shots/' \
            --exclude 'scripts/' \
            --exclude 'content/' \
            --exclude 'news/_article-template.html' \
            --exclude 'node_modules/' \
            --exclude 'serve.py' \
            --exclude 'README.md' \
            --exclude 'CNAME' \
            ./ _site/
          rm -f _site/CNAME
          if [ -f CNAME ] && grep -qi 'britecyte.com' CNAME; then
            echo "Refusing to publish a britecyte.com CNAME from this testing fork."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
